<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HouseDash — Demo Controls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090d;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
      max-width: 560px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; margin-bottom: 6px; color: #38bdf8; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .card {
      background: #0f141e;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 15px; color: #cbd5e1; margin-bottom: 12px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #07090d;
      color: #f8fafc;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      background: #0284c7;
      color: #f8fafc;
      width: 100%;
    }
    button:hover { background: #0369a1; }
    button.secondary { background: #1e293b; color: #e2e8f0; }
    button.secondary:hover { background: #334155; }
    button.active { background: #dc2626; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { font-size: 13px; color: #64748b; margin-top: 10px; }
    #status { font-size: 13px; color: #22c55e; min-height: 20px; margin-top: 8px; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <h1>TV Caster Demo Controls</h1>
  <p class="sub">Changes appear on the TV after ~8–12s of HLS buffer. <a href="/">Preview TV view →</a></p>

  <div class="card">
    <h2>Message on TV</h2>
    <input id="msg" type="text" placeholder="Type something to show on the TV...">
    <button onclick="sendMessage()">Update TV Message</button>
  </div>

  <div class="card">
    <h2>Quick Actions</h2>
    <div class="row">
      <button onclick="triggerChime()">Play Chime on TV</button>
      <button id="nightBtn" class="secondary" onclick="toggleNight()">Night Blackout: OFF</button>
    </div>
    <div id="status"></div>
    <p class="hint">Night blackout sends pure #000000 black while keeping the HLS stream alive so the AIMIBO stays off its bright blue home screen.</p>
  </div>

  <script>
    let state = { message: "", night_blackout: false, chime_seq: 0 };

    function setStatus(txt) {
      document.getElementById("status").textContent = txt;
    }

    function render() {
      document.getElementById("msg").value = state.message || "";
      const btn = document.getElementById("nightBtn");
      btn.textContent = state.night_blackout ? "Night Blackout: ON" : "Night Blackout: OFF";
      btn.classList.toggle("active", state.night_blackout);
    }

    async function loadState() {
      const res = await fetch("/api/state");
      state = await res.json();
      render();
    }

    async function postUpdate(patch, label) {
      const res = await fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      state = await res.json();
      render();
      setStatus(label + " (visible on TV in ~10s)");
    }

    function sendMessage() {
      postUpdate({ message: document.getElementById("msg").value }, "Updated message");
    }

    function triggerChime() {
      postUpdate({ play_chime: true }, "Triggered chime");
    }

    function toggleNight() {
      postUpdate({ night_blackout: !state.night_blackout }, state.night_blackout ? "Blackout OFF" : "Blackout ON");
    }

    loadState();
  </script>
</body>
</html>
